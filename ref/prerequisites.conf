# Runtime / toolchain prerequisites for this project.
#
# Checked by scripts/check-prerequisites.sh, which the setup validator runs, so
# the Wake Up protocol reports these on a machine you haven't worked on before.
# The point is that "everything I need to work on this project" becomes
# something a new machine can actually verify, rather than something you
# rediscover by hitting an error.
#
# One per line:
#
#     label | command | expected-regex
#
#   label            what to call it in the report
#   command          shell command that prints a version (or just succeeds)
#   expected-regex   optional; extended regex the output must match.
#                    Leave it off to accept any version, i.e. presence is enough.
#
# Only the first two '|' characters are delimiters -- everything after the
# second one is the regex, verbatim. So alternation like ^(8|9)\. works fine,
# pipes and all. An unusable pattern is reported as a bad pattern rather than
# being mistaken for a version mismatch.
#
# INSTALL INSTRUCTIONS -- write them on continuation lines starting with '>'
# directly under the check they belong to:
#
#     .NET SDK | dotnet --version | ^(8|9)\.
#     > winget install Microsoft.DotNet.SDK.8
#     > or download from https://dotnet.microsoft.com/download
#
# They are printed at the point of failure, which is the point of them: this
# script cannot install a runtime for you (that is your call, and usually needs
# elevation), so the least it can do is tell you exactly how. A check that
# reports NOT FOUND and stops leaves whoever is setting up a new machine to
# work it out themselves -- which is the situation this whole file exists to
# prevent. Anything without a hint is reported as a missing hint, so the gap
# gets closed rather than rediscovered.
#
# Hints use '>' rather than a fourth pipe field because the regex is verbatim
# after the second pipe, and they can span as many lines as a real install
# needs.
#
# Blank lines and lines starting with # are ignored. An empty file (or one with
# only comments, like this one) checks nothing and warns about nothing.
#
# Examples -- uncomment and adapt for a real project:
#
# .NET SDK        | dotnet --version   | ^(8|9)\.
# > winget install Microsoft.DotNet.SDK.8
# Python          | py --version       | ^Python 3\.(1[1-9]|[2-9])
# > winget install Python.Python.3.12
# Node.js         | node --version     | ^v(20|22|24)\.
# > winget install OpenJS.NodeJS.LTS
# PowerShell 7+   | pwsh --version     | ^PowerShell 7\.
# > winget install Microsoft.PowerShell
# Docker running  | docker info        |
# > Start Docker Desktop, or install it: winget install Docker.DockerDesktop
#
# Luna-Core itself declares nothing: it's documentation, shell scripts and
# agent definitions, so git and bash are all it needs, and both are implied by
# being able to run this check at all.
